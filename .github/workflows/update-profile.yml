name: Update profile statistics
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/update-profile.yml
  # UTC+8: 02:23, 08:23, 14:23 and 20:23.
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: profile-statistics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test parser and renderer
        run: python3 -m unittest discover -s tests -v
      - name: Refresh public statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build.py
      - name: Commit generated output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add README.md assets data/snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh profile statistics'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$GITHUB_REF_NAME"
