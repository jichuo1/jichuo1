<svg xmlns="http://www.w3.org/2000/svg" width="480" height="112" viewBox="0 0 480 112" role="img" aria-label="GlobalTokenTracker">
<title>GlobalTokenTracker</title><style>text{fill:#f0eee8;font-family:Georgia,'Times New Roman',serif}.muted{fill:#a8b4c4}.label{font:12px monospace;letter-spacing:1.2px;fill:#a8b4c4}.rule{stroke:#30363d}</style><rect width="900" height="112" fill="#0d1117"/><text x="18" y="31" font-size="23" class="" text-anchor="start" font-weight="bold">GlobalTokenTracker</text><text x="18" y="58" font-size="16" class="muted" text-anchor="start" >Native visibility into AI coding usage.</text><text x="18" y="87" font-size="16" class="muted" text-anchor="start" >v0.8.6</text><text x="460" y="87" font-size="16" class="muted" text-anchor="end" >0 stars</text><path d="M18 106H462" class="rule"/><style>.sway{animation:sway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}.glow{animation:glow 4s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.sway,.glow{animation:none}}</style><g transform="translate(265 83) scale(0.48)"><title>Original decorative scene for GlobalTokenTracker</title><rect x="-29" y="-20" width="58" height="36" rx="6" fill="#263345" stroke="#dce6ef" stroke-width="1.6"/><path d="M-18-8l6 5-6 5m12 0h12" fill="none" stroke="#75a9ff" stroke-width="2" stroke-linecap="round"/><path class="glow" d="M12 3h5" stroke="#d8b64c" stroke-width="2"/><path d="M-7 16v7m14-7v7M-17 23h34" stroke="#dce6ef" stroke-width="1.5"/><circle cx="38" cy="9" r="7" fill="#d8b64c"/><path d="M38 5v8m-2-6h4m-4 4h4" stroke="#dce6ef" stroke-width="1"/></g><g><title>Cumulative public Stars: 0; relative to most-starred featured project (132), not recent traffic or trend</title><rect x="407" y="98" width="50" height="3" rx="1.5" fill="#263345"/><rect x="407" y="98" width="0.000" height="3" rx="1.5" fill="#d8b64c"/></g></svg>