    <path d="M-19 13l6 4m26 0 6-4" stroke="#d8b64c" stroke-width="3" stroke-linecap="round"/>
    <g class="blink" fill="#29364b"><ellipse cx="-9" cy="25" rx="1.7" ry="2.3"/><ellipse cx="9" cy="25" rx="1.7" ry="2.3"/></g>
    <path d="M-3 30q3 4 6 0" fill="none" stroke="#29364b" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-31" y="39" width="62" height="12" rx="4" fill="#3b78d6"/>
    <path d="M-22 45h5m5 0h5m5 0h5m5 0h5m5 0h5" stroke="#f2f6fc" stroke-width="2"/>
    <g class="tap" fill="#f2f6fc" stroke="#29364b" stroke-width="1.5"><ellipse cx="-14" cy="39" rx="7" ry="4"/><ellipse cx="14" cy="39" rx="7" ry="4"/></g></g></svg>